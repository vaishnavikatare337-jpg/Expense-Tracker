<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="top">
    <h1>Spent in</h1>
    <select id="month" aria-label="Month"></select>
  </div>
  <div class="total" id="total">₹0</div>
  <p class="sub" id="sub"></p>

  <div class="panel">
    <h2>Add expense</h2>
    <div class="row">
      <label>Amount (₹)<input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="250"></label>
      <label>Category
        <select id="cat"><option>Food</option><option>Transport</option><option>Bills</option><option>Shopping</option><option>Health</option><option>Fun</option><option>Other</option></select>
      </label>
      <label>Date<input id="date" type="date"></label>
      <label>Note<input id="note" type="text" maxlength="60" placeholder="Lunch with Riya"></label>
    </div>
    <button class="add" id="add">Add expense</button>
    <p class="err" id="err" role="alert"></p>
  </div>

  <div class="panel"><h2>By category</h2><div id="cats"></div></div>
  <div class="panel"><h2>Expenses</h2><div id="list"></div></div>
</main>
<script src="app.js"></script>
</body>
</html>
